name: Android CI/CD Pipeline

# Develop checks only. A push to master is published by ci-cd.yml (stable-release):
# signed AAB + APK, GitHub release, and Play internal upload. This file used to
# publish a second master release without the Play AAB.

on:
  push:
    branches: [ develop ]

jobs:

  # ─────────────────────────────────────────────
  # DEVELOP — Unit tests + Lint only
  # ─────────────────────────────────────────────
  build-develop:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Run Lint Analysis
        run: ./gradlew lintDebug

      - name: Upload Test & Lint Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: develop-reports
          path: "**/build/reports/"
          retention-days: 14
