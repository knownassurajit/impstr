name: CI/CD

on:
  push:
    branches: [ develop, master ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:

  # ─────────────────────────────────────────────
  # TEST — Unit tests + Lint (every push to develop/master, every PR)
  # ─────────────────────────────────────────────
  test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: eclipse-temurin:17-jdk-jammy

    steps:
      - name: Install container prerequisites
        run: |
          apt-get update
          apt-get install -y unzip curl

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Play applicationId
        run: |
          # Release identity is the root project (settings.gradle.kts does not include :app).
          grep -q 'applicationId = "com.knownassurajit.impstr_game.app"' build.gradle.kts
          grep -q 'compileSdk = 36' build.gradle.kts
          grep -q 'targetSdk = 36' build.gradle.kts
          grep -q 'packageName: com.knownassurajit.impstr_game.app' .github/workflows/ci-cd.yml

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Run Lint Analysis
        run: ./gradlew lintDebug --no-daemon

      - name: Upload Test & Lint Reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: test-reports
          path: "**/build/reports/"
          retention-days: 14

  # ─────────────────────────────────────────────
  # DEPENDENCY REVIEW — pull requests only
  # ─────────────────────────────────────────────
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9
        with:
          fail-on-severity: high

  # ─────────────────────────────────────────────
  # DEBUG-RELEASE — develop pushes → unsigned debug APK, GitHub pre-release
  # ─────────────────────────────────────────────
  debug-release:
    name: Create Pre-release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Extract Version from Gradle
        id: version
        run: |
          # Root module only. app/build.gradle.kts is not included by settings.gradle.kts.
          GRADLE_FILE="build.gradle.kts"
          echo "Using Gradle file: $GRADLE_FILE"

          VERSION=""

          # Pattern 1: versionName "x.x.x" (Groovy literal string)
          if grep -q -E 'versionName\s+"[^$][^"]*"' "$GRADLE_FILE"; then
            VERSION=$(grep -E 'versionName\s+"[^$][^"]*"' "$GRADLE_FILE" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')

          # Pattern 2: versionName = "x.x.x" (.kts literal string)
          elif grep -q -E 'versionName\s*=\s*"[0-9]+\.[0-9]' "$GRADLE_FILE"; then
            VERSION=$(grep -E 'versionName\s*=\s*"[0-9]+\.[0-9]' "$GRADLE_FILE" | head -1 | sed -E 's/.*"([0-9][^"]+)".*/\1/')

          # Pattern 3: val major/minor/patch/build variables (fallback)
          elif grep -q -E 'val\s+major\s*=\s*[0-9]+' "$GRADLE_FILE"; then
            MAJOR=$(grep -E 'val\s+major\s*=\s*[0-9]+' "$GRADLE_FILE" | head -1 | grep -o -E '[0-9]+')
            MINOR=$(grep -E 'val\s+minor\s*=\s*[0-9]+' "$GRADLE_FILE" | head -1 | grep -o -E '[0-9]+')
            PATCH=$(grep -E 'val\s+patch\s*=\s*[0-9]+' "$GRADLE_FILE" | head -1 | grep -o -E '[0-9]+')
            BUILD=$(grep -E 'val\s+build\s*=\s*[0-9]+' "$GRADLE_FILE" | head -1 | grep -o -E '[0-9]+')
            VERSION="${MAJOR}.${MINOR}.${PATCH}.${BUILD}"
          fi

          VERSION=${VERSION#v}
          if [ -z "$VERSION" ]; then
            VERSION=$(date +'%Y.%m.%d')
            echo "⚠️ Could not extract version, using date: $VERSION"
          fi

          echo "✅ Final version: $VERSION"
          echo "app_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --oneline -20 --pretty="- %s (%h)")
          else
            LOG=$(git log --pretty="- %s (%h)" ${PREV_TAG}..HEAD)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Rename APK
        id: rename
        run: |
          VERSION="${{ steps.version.outputs.app_version }}"
          APK_FILE=$(find . -path "*/apk/debug/*.apk" | head -n 1)
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "❌ Debug APK not found."
            find . -name "*.apk"
            exit 1
          fi
          NEW_NAME="impstr-debug-v${VERSION}.apk"
          mv "$APK_FILE" "${NEW_NAME}"
          echo "renamed_apk=${NEW_NAME}" >> $GITHUB_OUTPUT

      - name: Create Pre-release and Upload APK
        if: success()
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda
        with:
          files: ${{ steps.rename.outputs.renamed_apk }}
          tag_name: v${{ steps.version.outputs.app_version }}-dev.${{ github.run_number }}
          name: "IMPSTR v${{ steps.version.outputs.app_version }} (Debug Pre-release #${{ github.run_number }})"
          body: |
            🧪 **Debug build from `develop`** — unsigned, for internal testing only.

            ## What's Changed
            ${{ steps.changelog.outputs.changelog }}

            ---
            | Field | Value |
            |---|---|
            | **Version** | v${{ steps.version.outputs.app_version }} |
            | **Branch** | develop |
            | **Build** | #${{ github.run_number }} |
            | **Commit** | ${{ github.sha }} |
            | **Triggered by** | @${{ github.actor }} |

            ## Installation
            Download `impstr-debug-v${{ steps.version.outputs.app_version }}.apk` below.
            This is an **unsigned debug build** — enable **Install from unknown sources** to sideload it.
          draft: false
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # PR-SUMMARY — pull requests targeting master (develop → master promotion)
  # ─────────────────────────────────────────────
  pr-summary:
    name: PR summary
    needs: test
    if: always() && github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: eclipse-temurin:17-jdk-jammy
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Install container prerequisites
        run: |
          apt-get update
          apt-get install -y unzip curl

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run checks and capture results
        id: checks
        continue-on-error: true
        run: |
          set +e

          run_step() {
            local name="$1"; shift
            local outfile="$1"; shift
            "$@" > "$outfile" 2>&1
            local status=$?
            if [ $status -eq 0 ]; then
              echo "${name}_STATUS=pass" >> "$GITHUB_ENV"
            else
              echo "${name}_STATUS=fail" >> "$GITHUB_ENV"
            fi
            return 0
          }

          run_step LINT lint.log ./gradlew lintDebug --no-daemon
          run_step UNIT_TEST unittest.log ./gradlew testDebugUnitTest --no-daemon

          UNIT_TESTS_RUN=$(grep -ohE '[0-9]+ tests completed' unittest.log | tail -n 1 | awk '{print $1}')
          echo "UNIT_TESTS_RUN=${UNIT_TESTS_RUN:-unknown}" >> $GITHUB_ENV

      - name: Determine version delta
        id: version_delta
        run: |
          GRADLE_FILE="build.gradle.kts"
          MAJOR=$(grep -E 'val\s+major\s*=\s*[0-9]+' "$GRADLE_FILE" | head -1 | grep -o -E '[0-9]+')
          MINOR=$(grep -E 'val\s+minor\s*=\s*[0-9]+' "$GRADLE_FILE" | head -1 | grep -o -E '[0-9]+')
          PATCH=$(grep -E 'val\s+patch\s*=\s*[0-9]+' "$GRADLE_FILE" | head -1 | grep -o -E '[0-9]+')
          BUILD=$(grep -E 'val\s+build\s*=\s*[0-9]+' "$GRADLE_FILE" | head -1 | grep -o -E '[0-9]+')
          CURRENT_VERSION="${MAJOR}.${MINOR}.${PATCH}.${BUILD}"
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV

          LAST_STABLE_TAG=$(git tag --list 'v*' --sort=-creatordate | grep -vE '\-dev\.' | head -n 1)
          if [ -n "$LAST_STABLE_TAG" ]; then
            echo "LAST_STABLE_TAG=$LAST_STABLE_TAG" >> $GITHUB_ENV
            COMMITS_SINCE=$(git rev-list "${LAST_STABLE_TAG}..HEAD" --count 2>/dev/null || echo "unknown")
            echo "COMMITS_SINCE=$COMMITS_SINCE" >> $GITHUB_ENV
          else
            echo "LAST_STABLE_TAG=(none found)" >> $GITHUB_ENV
            echo "COMMITS_SINCE=unknown" >> $GITHUB_ENV
          fi

      - name: Generate changelog preview
        run: |
          if [ -n "$LAST_STABLE_TAG" ] && [ "$LAST_STABLE_TAG" != "(none found)" ]; then
            git log --pretty=format:'- %h %s (%an, %ad)' --date=short "${LAST_STABLE_TAG}..HEAD" --no-merges > changelog_preview.txt || true
          else
            git log --pretty=format:'- %h %s (%an, %ad)' --date=short -n 20 --no-merges > changelog_preview.txt || true
          fi

      - name: Write PR comment body
        run: |
          {
            echo "## PR Summary: develop -> master"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Android Lint (lintDebug) | ${LINT_STATUS:-unknown} |"
            echo "| Unit tests (testDebugUnitTest) | ${UNIT_TEST_STATUS:-unknown} (${UNIT_TESTS_RUN:-unknown} tests) |"
            echo
            echo "### Version delta"
            echo "- Current \`versionName\`: \`$CURRENT_VERSION\`"
            echo "- Last stable tag: \`$LAST_STABLE_TAG\`"
            echo "- Commits since last stable release: $COMMITS_SINCE"
            echo
            echo "### Changelog preview (since last stable release)"
            echo '```'
            cat changelog_preview.txt
            echo '```'
          } > pr_comment_body.md

      - name: Post PR comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('pr_comment_body.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '## PR Summary: develop -> master';
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail job if any check failed
        if: env.LINT_STATUS == 'fail' || env.UNIT_TEST_STATUS == 'fail'
        run: |
          echo "One or more checks failed. See summary above."
          exit 1

  # ─────────────────────────────────────────────
  # STABLE-RELEASE — push to master (production branch; this repo has no main)
  #
  # Builds and signs:
  #   - AAB at build/outputs/bundle/release (uploaded to Play)
  #   - APK at build/outputs/apk/release (GitHub Release sideload)
  # The Gradle project is the repository root. Do not look under app/.
  #
  # Play Console package: com.knownassurajit.impstr_game.app
  # Release name prefix matches the GitHub repo: impstr
  # Track: internal
  # This job does not edit the Play store listing title.
  #
  # Secrets (existing names only):
  #   SIGNING_KEY, ALIAS, KEY_STORE_PASSWORD, KEY_PASSWORD — required to sign
  #   PLAY_CONSOLE_JSON — service account JSON. When unset, Play upload is skipped
  #   and the GitHub release still publishes.
  #
  # versionCode = gradle formula + github.run_number, so a later master merge
  # can upload without editing build.gradle.kts. Play rejects a repeated code.
  # ─────────────────────────────────────────────
  stable-release:
    name: Prepare Release, Publish GitHub & Play Console
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testReleaseUnitTest --no-daemon

      - name: Run Lint Analysis
        run: ./gradlew lintRelease --no-daemon

      - name: Resolve release version
        id: version
        run: |
          GRADLE_FILE="build.gradle.kts"
          MAJOR=$(grep -E 'val[[:space:]]+major[[:space:]]*=' "$GRADLE_FILE" | head -1 | grep -oE '[0-9]+')
          MINOR=$(grep -E 'val[[:space:]]+minor[[:space:]]*=' "$GRADLE_FILE" | head -1 | grep -oE '[0-9]+')
          PATCH=$(grep -E 'val[[:space:]]+patch[[:space:]]*=' "$GRADLE_FILE" | head -1 | grep -oE '[0-9]+')
          BUILD=$(grep -E 'val[[:space:]]+build[[:space:]]*=' "$GRADLE_FILE" | head -1 | grep -oE '[0-9]+')
          if [ -z "$MAJOR" ] || [ -z "$MINOR" ] || [ -z "$PATCH" ] || [ -z "$BUILD" ]; then
            echo "Could not read major/minor/patch/build from $GRADLE_FILE"
            exit 1
          fi
          # Must match versionName in build.gradle.kts: build + ciBuildNumber.
          EFFECTIVE_BUILD=$((BUILD + ${{ github.run_number }}))
          VERSION="${MAJOR}.${MINOR}.${PATCH}.${EFFECTIVE_BUILD}"
          echo "app_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version $VERSION (ciBuildNumber=${{ github.run_number }})"

      - name: Build release AAB and APK
        run: ./gradlew bundleRelease assembleRelease --no-daemon -PciBuildNumber=${{ github.run_number }}

      - name: Locate release artifacts
        id: locate
        run: |
          AAB_FILE=$(find build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)
          APK_FILE=$(find build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          if [ -z "$AAB_FILE" ] || [ ! -f "$AAB_FILE" ]; then
            echo "Release AAB not found under build/outputs/bundle/release"
            find build/outputs -name '*.aab' -o -name '*.apk' || true
            exit 1
          fi
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "Release APK not found under build/outputs/apk/release"
            find build/outputs -name '*.apk' || true
            exit 1
          fi
          echo "aab_dir=$(dirname "$AAB_FILE")" >> "$GITHUB_OUTPUT"
          echo "apk_dir=$(dirname "$APK_FILE")" >> "$GITHUB_OUTPUT"
          echo "AAB: $AAB_FILE"
          echo "APK: $APK_FILE"

      - name: Sign release AAB
        id: sign_aab
        uses: r0adkll/sign-android-release@d5f8436b702872ad5cdb1e6e4d5c8b983d25a997
        with:
          releaseDirectory: ${{ steps.locate.outputs.aab_dir }}
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Sign release APK
        id: sign_apk
        uses: r0adkll/sign-android-release@d5f8436b702872ad5cdb1e6e4d5c8b983d25a997
        with:
          releaseDirectory: ${{ steps.locate.outputs.apk_dir }}
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Remove temporary keystores
        if: success()
        run: rm -f build/outputs/bundle/release/signingKey.jks build/outputs/apk/release/signingKey.jks

      - name: Generate Changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --oneline -20 --pretty="- %s (%h)")
          else
            LOG=$(git log --pretty="- %s (%h)" ${PREV_TAG}..HEAD)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Name release artifacts
        id: rename
        run: |
          VERSION="${{ steps.version.outputs.app_version }}"
          SIGNED_AAB="${{ steps.sign_aab.outputs.signedReleaseFile }}"
          SIGNED_APK="${{ steps.sign_apk.outputs.signedReleaseFile }}"
          AAB_NAME="impstr-release-v${VERSION}.aab"
          APK_NAME="impstr-release-v${VERSION}.apk"
          if [ -z "$SIGNED_AAB" ] || [ ! -f "$SIGNED_AAB" ]; then
            echo "Signed AAB not found at: $SIGNED_AAB"
            find build/outputs -name '*.aab' || true
            exit 1
          fi
          if [ -z "$SIGNED_APK" ] || [ ! -f "$SIGNED_APK" ]; then
            echo "Signed APK not found at: $SIGNED_APK"
            find build/outputs -name '*.apk' || true
            exit 1
          fi
          cp "$SIGNED_AAB" "$AAB_NAME"
          cp "$SIGNED_APK" "$APK_NAME"
          echo "renamed_aab=$AAB_NAME" >> "$GITHUB_OUTPUT"
          echo "renamed_apk=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: impstr-release-v${{ steps.version.outputs.app_version }}
          path: |
            ${{ steps.rename.outputs.renamed_aab }}
            ${{ steps.rename.outputs.renamed_apk }}
          retention-days: 90

      - name: Upload Test & Lint Reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: master-reports
          path: "**/build/reports/"
          retention-days: 30

      - name: Create Stable Release and Upload APK
        if: success()
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda
        with:
          files: |
            ${{ steps.rename.outputs.renamed_aab }}
            ${{ steps.rename.outputs.renamed_apk }}
          tag_name: v${{ steps.version.outputs.app_version }}+${{ github.run_number }}
          name: "impstr v${{ steps.version.outputs.app_version }} (Stable Release)"
          body: |
            Production release `v${{ steps.version.outputs.app_version }}` for **impstr**.

            Play package: `com.knownassurajit.impstr_game.app`
            Play track: internal, when `PLAY_CONSOLE_JSON` is configured.

            ## What's Changed
            ${{ steps.changelog.outputs.changelog }}

            ---
            | Field | Value |
            |---|---|
            | **Version** | v${{ steps.version.outputs.app_version }} |
            | **Branch** | master |
            | **Build** | #${{ github.run_number }} |
            | **Commit** | ${{ github.sha }} |
            | **Triggered by** | @${{ github.actor }} |

            ## Installation
            `impstr-release-v${{ steps.version.outputs.app_version }}.aab` is the Play artifact.
            `impstr-release-v${{ steps.version.outputs.app_version }}.apk` is the signed sideload build.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect Play Console credentials
        id: play
        env:
          PLAY_CONSOLE_JSON: ${{ secrets.PLAY_CONSOLE_JSON }}
        run: |
          # Step env is visible here. A job-level `if: env.PLAY_CONSOLE_JSON != ''`
          # check is unreliable for a multiline service-account JSON.
          if [ -n "$PLAY_CONSOLE_JSON" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "PLAY_CONSOLE_JSON is unset. Skipping Google Play upload."
          fi

      - name: Generate Play Store Release Notes
        if: steps.play.outputs.enabled == 'true'
        run: |
          mkdir -p release_notes/en-US
          cat > release_notes/en-US/default.txt <<EOF
          impstr ${{ steps.version.outputs.app_version }}
          EOF

      - name: Publish to Google Play (internal track)
        if: steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@744d577ff543375f35f60408e13fb32c7caa90ce
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONSOLE_JSON }}
          packageName: com.knownassurajit.impstr_game.app
          releaseFiles: ${{ steps.rename.outputs.renamed_aab }}
          track: internal
          status: completed
          whatsNewDirectory: release_notes
          releaseName: impstr-${{ steps.version.outputs.app_version }}
