[versions]
agp               = "8.9.2"
kotlin            = "2.1.21"
ksp               = "2.1.21-2.0.2"
coreKtx           = "1.16.0"
lifecycleRuntime  = "2.9.0"
activityCompose   = "1.10.1"
composeBom        = "2025.05.01"
material3         = "1.4.0"
navigationCompose = "2.9.0"
hilt              = "2.56.2"
hiltNavCompose    = "1.4.0"
room              = "2.8.4"
datastore         = "1.1.4"
coroutines        = "1.10.2"
junit             = "4.13.2"
junitExt          = "1.3.0"
espresso          = "3.7.0"
testCore          = "1.7.0"
testRunner        = "1.7.0"
mockito           = "5.21.0"
mockitoKotlin     = "6.2.3"
reorderable       = "3.1.0"
robolectric       = "4.15.1"
securityCrypto    = "1.0.0"

[libraries]
androidx-core-ktx                    = { group = "androidx.core",             name = "core-ktx",                      version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx       = { group = "androidx.lifecycle",         name = "lifecycle-runtime-ktx",          version.ref = "lifecycleRuntime" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle",         name = "lifecycle-viewmodel-compose",    version.ref = "lifecycleRuntime" }
androidx-lifecycle-runtime-compose   = { group = "androidx.lifecycle",         name = "lifecycle-runtime-compose",      version.ref = "lifecycleRuntime" }
androidx-activity-compose            = { group = "androidx.activity",          name = "activity-compose",               version.ref = "activityCompose" }
androidx-compose-bom                 = { group = "androidx.compose",           name = "compose-bom",                    version.ref = "composeBom" }
androidx-compose-ui                  = { group = "androidx.compose.ui",        name = "ui" }
androidx-compose-ui-graphics         = { group = "androidx.compose.ui",        name = "ui-graphics" }
androidx-compose-ui-tooling          = { group = "androidx.compose.ui",        name = "ui-tooling" }
androidx-compose-ui-tooling-preview  = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest    = { group = "androidx.compose.ui",        name = "ui-test-manifest" }
androidx-compose-ui-test-junit4      = { group = "androidx.compose.ui",        name = "ui-test-junit4" }
androidx-compose-material3           = { group = "androidx.compose.material3", name = "material3",                      version.ref = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose          = { group = "androidx.navigation",         name = "navigation-compose",             version.ref = "navigationCompose" }
hilt-android                         = { group = "com.google.dagger",           name = "hilt-android",                   version.ref = "hilt" }
hilt-android-compiler                = { group = "com.google.dagger",           name = "hilt-android-compiler",          version.ref = "hilt" }
androidx-hilt-navigation-compose     = { group = "androidx.hilt",              name = "hilt-navigation-compose",        version.ref = "hiltNavCompose" }
androidx-room-runtime                = { group = "androidx.room",               name = "room-runtime",                   version.ref = "room" }
androidx-room-ktx                    = { group = "androidx.room",               name = "room-ktx",                       version.ref = "room" }
androidx-room-compiler               = { group = "androidx.room",               name = "room-compiler",                  version.ref = "room" }
androidx-datastore-preferences       = { group = "androidx.datastore",          name = "datastore-preferences",          version.ref = "datastore" }
kotlinx-coroutines-android           = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-android",     version.ref = "coroutines" }
junit                                = { group = "junit",                        name = "junit",                          version.ref = "junit" }
androidx-test-ext-junit              = { group = "androidx.test.ext",            name = "junit",                          version.ref = "junitExt" }
androidx-test-espresso-core          = { group = "androidx.test.espresso",      name = "espresso-core",                  version.ref = "espresso" }
androidx-test-core                   = { group = "androidx.test",                name = "core",                           version.ref = "testCore" }
androidx-test-runner                 = { group = "androidx.test",                name = "runner",                         version.ref = "testRunner" }
androidx-test-rules                  = { group = "androidx.test",                name = "rules",                          version.ref = "testRunner" }
mockito-core                         = { group = "org.mockito",                 name = "mockito-core",                   version.ref = "mockito" }
mockito-kotlin                       = { group = "org.mockito.kotlin",          name = "mockito-kotlin",                 version.ref = "mockitoKotlin" }
kotlin-coroutines-test               = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-test",        version.ref = "coroutines" }
reorderable                          = { group = "sh.calvin.reorderable", name = "reorderable",             version.ref = "reorderable" }
androidx-security-crypto             = { group = "androidx.security",           name = "security-crypto",                version.ref = "securityCrypto" }
robolectric                          = { group = "org.robolectric",             name = "robolectric",                    version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application",             version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-parcelize    = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
hilt-android        = { id = "com.google.dagger.hilt.android",      version.ref = "hilt" }
ksp                 = { id = "com.google.devtools.ksp",              version.ref = "ksp" }
